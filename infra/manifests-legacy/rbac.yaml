apiVersion: v1
kind: ServiceAccount
metadata:
  name: render-api-sa
  namespace: render-farm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: render-api-role
  namespace: render-farm
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: render-api-rolebinding
  namespace: render-farm
subjects:
  - kind: ServiceAccount
    name: render-api-sa
    namespace: render-farm
roleRef:
  kind: Role
  name: render-api-role
  apiGroup: rbac.authorization.k8s.io
