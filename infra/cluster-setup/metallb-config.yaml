apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: render-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.2.200-192.168.2.220
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: render-l2adv
  namespace: metallb-system
spec:
  ipAddressPools:
    - render-pool
